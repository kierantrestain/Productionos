# Hourly background jobs (scheduled automations, data syncs, outbox retries).
# Vercel's Hobby plan only allows a daily cron, so this calls the protected job endpoint every hour.
# Requires repository secrets: JOBS_URL (e.g. https://<app>.vercel.app/api/jobs/run) and CRON_SECRET
# (the same value as the CRON_SECRET environment variable on Vercel). Skips cleanly when unset.
name: Hourly jobs
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call job runner
        env:
          JOBS_URL: ${{ secrets.JOBS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$JOBS_URL" ] || [ -z "$CRON_SECRET" ]; then echo "JOBS_URL / CRON_SECRET not configured — skipping."; exit 0; fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 120 "$JOBS_URL")
          cat /tmp/out.json; echo
          test "$code" = "200"
